<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout('Uji Mandiri Pajak', ~{::#page-title}, ~{::section}, ~{})}"
      lang="id">
<head>
    <title>Uji Mandiri Pajak</title>
</head>
<body>
    <h1 id="page-title">Uji Mandiri Pajak</h1>

    <section class="h-full flex flex-col overflow-y-auto" data-testid="self-test-page">
        <div class="max-w-6xl">
            <div th:if="${successMessage}" data-testid="flash-success" class="mb-4 p-4 bg-green-50 border border-green-200 rounded-lg">
                <p class="text-sm text-green-800" th:text="${successMessage}"></p>
            </div>
            <div th:if="${errorMessage}" data-testid="flash-error" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-sm text-red-800" th:text="${errorMessage}"></p>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
                <form th:action="@{/reports/self-test}" method="get" class="flex flex-wrap items-end gap-4">
                    <div class="min-w-[160px]">
                        <label for="year" class="block text-sm font-medium text-gray-700 mb-1">Tahun</label>
                        <input type="number" id="year" name="year" th:value="${year}" min="2000" max="2999" required
                               data-testid="self-test-year"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                    </div>
                    <button type="submit" data-testid="btn-show-self-test"
                            class="px-4 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 transition-colors">
                        Tampilkan
                    </button>
                </form>
                <p class="mt-3 text-xs text-gray-500">
                    Pemeriksaan silang yang biasa dijalankan kantor pajak dari SPT Tahunan. Selisih = angka buku dikurangi angka pajak.
                    Ambang beban lain-lain tanpa rincian: Rp <span data-testid="self-test-threshold" th:text="${#numbers.formatDecimal(threshold, 1, 'POINT', 0, 'COMMA')}">5.000.000</span>.
                </p>
            </div>

            <th:block th:if="${report}">
                <div th:each="row : ${report.lines()}"
                     th:id="|line-${row.line().name()}-${row.month()}|"
                     th:attr="data-testid=|self-test-row-${row.line().name()}-${row.month()}|"
                     th:class="${row.month() == 0} ? 'bg-white rounded-lg shadow-sm border border-gray-200 p-4 mt-6' : 'bg-white border-x border-b border-gray-200 px-4 py-3 ml-6'">
                    <div class="flex flex-wrap justify-between gap-2">
                        <div>
                            <h2 th:if="${row.month() == 0}" class="text-base font-semibold text-gray-900" th:text="${row.title()}">Baris</h2>
                            <p th:if="${row.month() == 0}" class="text-xs text-gray-500">
                                <span th:text="|Buku: ${row.bookBasis()}.|"></span>
                                <span th:text="${row.taxBasis() != null} ? |Pajak: ${row.taxBasis()}.| : 'Tidak ada angka pembanding di SPT; seluruh mutasi perlu dijelaskan.'"></span>
                            </p>
                            <p th:if="${row.month() != 0}" class="text-sm font-medium text-gray-700"
                               th:text="|Masa ${row.month()}/${report.year()}|">Masa</p>
                        </div>
                        <span data-testid="row-status" th:text="${row.status().label}" th:attr="data-status=${row.status().name()}"
                              th:class="${row.status().name() == 'MATCHED' or row.status().name() == 'NO_ACTIVITY'} ? 'px-2 py-0.5 h-fit text-xs rounded bg-green-100 text-green-800' : 'px-2 py-0.5 h-fit text-xs rounded bg-yellow-100 text-yellow-800'">MATCHED</span>
                    </div>

                    <p th:if="${row.message()}" data-testid="row-message" class="mt-2 text-sm text-yellow-800" th:text="${row.message()}"></p>

                    <dl th:if="${row.bookFigure() != null}" class="mt-2 grid grid-cols-3 gap-4 text-sm">
                        <div>
                            <dt class="text-xs text-gray-500">Angka buku</dt>
                            <dd class="font-mono" data-testid="row-book" th:text="${#numbers.formatDecimal(row.bookFigure(), 1, 'POINT', 2, 'COMMA')}">0</dd>
                        </div>
                        <div>
                            <dt class="text-xs text-gray-500">Angka pajak</dt>
                            <dd class="font-mono" data-testid="row-tax"
                                th:text="${row.taxFigure() != null} ? ${#numbers.formatDecimal(row.taxFigure(), 1, 'POINT', 2, 'COMMA')} : '-'">0</dd>
                        </div>
                        <div>
                            <dt class="text-xs text-gray-500">Selisih</dt>
                            <dd class="font-mono" data-testid="row-difference" th:text="${#numbers.formatDecimal(row.difference(), 1, 'POINT', 2, 'COMMA')}">0</dd>
                        </div>
                    </dl>

                    <div class="mt-2">
                        <p sec:authorize="!hasAuthority('FISCAL_PERIOD_MANAGE')" th:if="${row.explanation()}"
                           data-testid="row-explanation" class="text-sm text-gray-700" th:text="${row.explanation()}"></p>
                        <form sec:authorize="hasAuthority('FISCAL_PERIOD_MANAGE')" th:action="@{/reports/self-test/explanation}" method="post"
                              class="flex flex-wrap items-end gap-2">
                            <input type="hidden" name="year" th:value="${report.year()}">
                            <input type="hidden" name="line" th:value="${row.line().name()}">
                            <input type="hidden" name="month" th:value="${row.month()}">
                            <label class="flex-1 min-w-[240px]">
                                <span class="block text-xs text-gray-500 mb-1">Penjelasan</span>
                                <textarea name="explanation" rows="2" data-testid="row-explanation-input"
                                          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm"
                                          th:text="${row.explanation()}"></textarea>
                            </label>
                            <button type="submit" data-testid="btn-save-explanation"
                                    class="px-3 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 transition-colors">
                                Simpan
                            </button>
                        </form>
                        <p th:if="${row.explainedBy()}" class="mt-1 text-xs text-gray-500" data-testid="row-explained-by"
                           th:text="|Diubah ${row.explainedBy()}, ${#temporals.format(row.explainedAt(), 'dd/MM/yyyy HH:mm')}|"></p>
                    </div>
                </div>
            </th:block>
        </div>
    </section>
</body>
</html>
