<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('Ubah Password', ~{::#page-title}, ~{::section}, ~{})}"
      lang="id">
<head>
    <title>Ubah Password</title>
</head>
<body>
    <h1 id="page-title">Ubah Password</h1>

    <section class="space-y-6">
        <div th:if="${forced}" id="notice-password-change-required"
             class="bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-lg">
            Password akun ini ditetapkan oleh administrator. Ganti password sebelum memakai aplikasi.
        </div>
        <div th:if="${successMessage}" id="message-success"
             class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg">
            <span th:text="${successMessage}">Success</span>
        </div>
        <div th:if="${errors}" id="message-errors"
             class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
            <ul class="list-disc list-inside">
                <li th:each="error : ${errors}" th:text="${error}">Error</li>
            </ul>
        </div>

        <div class="bg-white rounded-lg shadow p-6 max-w-lg">
            <p class="text-sm text-gray-500 mb-6">
                Minimal <span th:text="${minLength}">12</span> karakter, dengan huruf besar, huruf kecil, angka,
                dan karakter khusus. Setelah diubah, sesi lain dan token perangkat akun ini diakhiri.
            </p>
            <form th:action="@{/account/password}" method="post" class="space-y-6">
                <div>
                    <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-1">
                        Password Saat Ini <span class="text-red-500">*</span>
                    </label>
                    <input type="password" id="currentPassword" name="currentPassword" required
                           autocomplete="current-password"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">
                        Password Baru <span class="text-red-500">*</span>
                    </label>
                    <input type="password" id="newPassword" name="newPassword" required th:minlength="${minLength}"
                           autocomplete="new-password"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">
                        Konfirmasi Password Baru <span class="text-red-500">*</span>
                    </label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required th:minlength="${minLength}"
                           autocomplete="new-password"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div class="flex justify-end pt-4 border-t">
                    <button id="btn-change-password" type="submit"
                            class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                        Simpan
                    </button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
