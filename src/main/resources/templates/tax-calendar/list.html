<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('Kalender Pajak', ~{::#page-title}, ~{::section}, ~{::script})}"
      lang="id">
<head>
    <title>Kalender Pajak</title>
</head>
<body>
    <h1 id="page-title">Kalender Pajak</h1>

    <section class="space-y-6">
        <div th:if="${successMessage}" data-testid="flash-success"
             class="p-4 rounded-lg bg-green-50 border border-green-200 text-sm font-medium text-green-800"
             th:text="${successMessage}">Success</div>
        <div th:if="${errorMessage}" data-testid="flash-error"
             class="p-4 rounded-lg bg-red-50 border border-red-200 text-sm font-medium text-red-800"
             th:text="${errorMessage}">Error</div>

        <!-- Header -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-4">
                <!-- Period Selector -->
                <label for="month-selector" class="sr-only">Bulan</label>
                <select id="month-selector"
                        name="month"
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500">
                    <option th:each="m : ${#numbers.sequence(1, 12)}"
                            th:value="${m}"
                            th:text="${monthNames[m]}"
                            th:selected="${selectedMonth == m}">Bulan</option>
                </select>

                <label for="year-selector" class="sr-only">Tahun</label>
                <select id="year-selector"
                        name="year"
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500">
                    <option th:each="y : ${#numbers.sequence(selectedYear - 5, selectedYear + 5)}"
                            th:value="${y}"
                            th:text="${y}"
                            th:selected="${selectedYear == y}">Tahun</option>
                </select>
            </div>

            <a th:href="@{/tax-calendar/yearly(year=${selectedYear})}"
               class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                Lihat Tahunan
            </a>
        </div>

        <!-- Summary Cards -->
        <div data-testid="summary-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-lg shadow">
                <div class="text-sm text-gray-500">Total</div>
                <div data-testid="total-count" class="text-2xl font-bold text-gray-900" th:text="${summary.totalDeadlines}">8</div>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <div class="text-sm text-gray-500">Selesai</div>
                <div data-testid="completed-count" class="text-2xl font-bold text-green-600" th:text="${summary.completedCount}">5</div>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <div class="text-sm text-gray-500">Terlambat</div>
                <div data-testid="overdue-count" class="text-2xl font-bold text-red-600" th:text="${summary.overdueCount}">1</div>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <div class="text-sm text-gray-500">Segera</div>
                <div data-testid="due-soon-count" class="text-2xl font-bold text-yellow-600" th:text="${summary.dueSoonCount}">2</div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="bg-white p-4 rounded-lg shadow">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-gray-700">Progress</span>
                <span class="text-sm font-medium text-gray-700"
                      th:text="${summary.completionPercentage + '%'}">62%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <style th:inline="text" th:attr="nonce=${cspNonce}">#tax-progress-bar { width: [[${summary.completionPercentage}]]%; }</style>
                <div id="tax-progress-bar"
                     class="h-2.5 rounded-full"
                     th:classappend="${summary.allCompleted ? 'bg-green-600' : 'bg-primary-600'}"></div>
            </div>
        </div>

        <!-- Checklist -->
        <div id="checklist-wrapper">
            <th:block th:insert="~{tax-calendar/fragments/checklist :: checklist}"/>
        </div>

        <div id="complete-modal" data-testid="complete-modal"
             class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-medium text-gray-900">Tandai Selesai</h3>
                </div>
                <form id="complete-form" th:action="@{/tax-calendar}" method="post" class="p-6 space-y-4">
                    <input type="hidden" name="year" id="modal-year">
                    <input type="hidden" name="month" id="modal-month">

                    <div>
                        <label for="completedDate" class="block text-sm font-medium text-gray-700 mb-1">Tanggal Selesai</label>
                        <input type="date" id="completedDate" name="completedDate" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500"
                               th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                    </div>

                    <div>
                        <label for="referenceNumber" class="block text-sm font-medium text-gray-700 mb-1">Nomor Referensi (NTPN/BPN)</label>
                        <input type="text" id="referenceNumber" name="referenceNumber"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500"
                               placeholder="Opsional">
                    </div>

                    <div>
                        <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Catatan</label>
                        <textarea id="notes" name="notes" rows="2"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500"
                                  placeholder="Opsional"></textarea>
                    </div>

                    <div class="flex justify-end gap-3 pt-4">
                        <button type="button" id="btn-modal-cancel"
                                class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                            Batal
                        </button>
                        <button type="submit" id="btn-modal-save"
                                class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                            Simpan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <script th:attr="nonce=${cspNonce}">
        function reloadPeriod() {
            const year = document.getElementById('year-selector').value;
            const month = document.getElementById('month-selector').value;
            globalThis.location.href = '/tax-calendar?year=' + year + '&month=' + month;
        }
        document.getElementById('month-selector').addEventListener('change', reloadPeriod);
        document.getElementById('year-selector').addEventListener('change', reloadPeriod);

        const modal = document.getElementById('complete-modal');
        function closeModal() {
            modal.classList.add('hidden');
        }

        document.querySelectorAll('.btn-mark-complete').forEach(btn => {
            btn.addEventListener('click', function() {
                document.getElementById('complete-form').action = '/tax-calendar/complete/' + this.dataset.deadlineId;
                document.getElementById('modal-year').value = this.dataset.year;
                document.getElementById('modal-month').value = this.dataset.month;
                modal.classList.remove('hidden');
            });
        });

        document.querySelectorAll('.form-uncomplete').forEach(form => {
            form.addEventListener('submit', function(e) {
                if (!confirm('Yakin ingin menghapus status selesai?')) {
                    e.preventDefault();
                }
            });
        });

        document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        modal.addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
