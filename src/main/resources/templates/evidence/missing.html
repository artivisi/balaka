<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout('Transaksi Kurang Bukti', ~{::#page-title}, ~{::section}, ~{})}"
      lang="id">
<head>
    <title>Transaksi Kurang Bukti</title>
</head>
<body>
    <h1 id="page-title">Transaksi Kurang Bukti</h1>

    <section class="space-y-6">
        <div th:if="${successMessage}" data-testid="flash-success"
             class="p-4 rounded-lg bg-green-50 border border-green-200 text-sm font-medium text-green-800"
             th:text="${successMessage}">Success</div>
        <div th:if="${errorMessage}" data-testid="flash-error"
             class="p-4 rounded-lg bg-red-50 border border-red-200 text-sm font-medium text-red-800"
             th:text="${errorMessage}">Error</div>
        <form th:action="@{/evidence/missing}" method="get" class="flex flex-wrap items-end gap-3">
            <div>
                <label for="from" class="block text-sm font-medium text-gray-700 mb-1">Dari</label>
                <input type="date" id="from" name="from" th:value="${from}" class="px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            <div>
                <label for="to" class="block text-sm font-medium text-gray-700 mb-1">Sampai</label>
                <input type="date" id="to" name="to" th:value="${to}" class="px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            <button id="btn-filter" type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">Tampilkan</button>
            <p id="missing-summary" class="text-sm text-gray-600 pb-2"
               th:text="|${checkedCount} transaksi terposting diperiksa, ${requiredCount} wajib bukti, ${#lists.size(gaps)} kurang bukti. Aturan aktif: ${ruleCount}.|">0</p>
        </form>

        <div class="bg-white rounded-lg shadow overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tanggal</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Transaksi</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nilai</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Bukti Wajib</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Bukti Kurang</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Catatan</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr th:if="${#lists.isEmpty(gaps)}">
                        <td colspan="6" class="px-4 py-8 text-center text-gray-500">Tidak ada transaksi kurang bukti pada periode ini</td>
                    </tr>
                    <tr th:each="g : ${gaps}" data-testid="gap-row" th:data-number="${g.transactionNumber}"
                        th:data-missing="${#strings.listJoin(g.missing, ' ')}" class="text-sm">
                        <td class="px-4 py-3" th:text="${#temporals.format(g.transactionDate, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td class="px-4 py-3">
                            <a class="text-primary-600 hover:underline" th:href="@{/transactions/{id}(id=${g.transactionId})}" th:text="${g.transactionNumber}">TRX</a>
                            <p class="text-xs text-gray-500" th:text="${g.description}">Keterangan</p>
                        </td>
                        <td class="px-4 py-3 text-right" th:text="${#numbers.formatDecimal(g.amount, 1, 'POINT', 0, 'COMMA')}">0</td>
                        <td class="px-4 py-3" th:text="${#strings.listJoin(g.required.![evidenceType.indonesianName], ', ')}">Kontrak</td>
                        <td class="px-4 py-3 text-red-700 font-medium" th:text="${#strings.listJoin(g.missing.![indonesianName], ', ')}">Kontrak</td>
                        <td class="px-4 py-3 text-xs text-gray-600" th:text="${#strings.listJoin(g.notes, '; ')}">-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</body>
</html>
