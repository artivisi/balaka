<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head><title>Evidence panel fragment</title></head>
<body>
<div th:fragment="panel" id="evidence-panel" data-testid="evidence-panel"
     th:data-complete="${evidence.complete()}">
    <p th:if="${#lists.isEmpty(evidence.required)}" data-testid="evidence-none-required" class="text-sm text-gray-500">
        Tidak ada aturan bukti yang berlaku untuk transaksi ini.
    </p>
    <ul th:unless="${#lists.isEmpty(evidence.required)}" class="space-y-2 text-sm">
        <li th:each="r : ${evidence.required}" data-testid="evidence-required" th:data-type="${r.evidenceType}"
            th:data-present="${!evidence.missing.contains(r.evidenceType)}" class="flex items-start justify-between">
            <div>
                <span class="font-medium text-gray-900" th:text="${r.evidenceType.indonesianName}">Kontrak</span>
                <p class="text-xs text-gray-500" th:text="|Diwajibkan oleh ${#strings.listJoin(r.rules, ', ')}|">Aturan</p>
            </div>
            <span class="px-2 py-1 text-xs font-medium rounded-full"
                  th:classappend="${evidence.missing.contains(r.evidenceType)} ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'"
                  th:text="${evidence.missing.contains(r.evidenceType)} ? 'Belum ada' : 'Ada'">Ada</span>
        </li>
    </ul>
    <div th:unless="${#lists.isEmpty(evidence.evidence)}" class="mt-4">
        <p class="text-xs font-medium text-gray-500 uppercase mb-1">Bukti Tercatat</p>
        <ul class="text-xs text-gray-700 space-y-1">
            <li th:each="e : ${evidence.evidence}" data-testid="evidence-item" th:data-type="${e.evidenceType}" th:data-source="${e.source}"
                th:text="|${e.evidenceType.indonesianName}: ${e.reference}|">Kontrak: K-1</li>
        </ul>
    </div>
    <ul th:unless="${#lists.isEmpty(evidence.notes)}" class="mt-3 text-xs text-amber-700 space-y-1">
        <li th:each="n : ${evidence.notes}" data-testid="evidence-note" th:text="${n}">Catatan</li>
    </ul>
</div>
</body>
</html>
