<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('Verifikasi MFA', ~{::#page-title}, ~{::section}, ~{::script})}"
      lang="id">
<head>
    <title>Verifikasi MFA</title>
</head>
<body>
    <h1 id="page-title">Verifikasi Multi-Factor Authentication</h1>

    <section class="max-w-md mx-auto">
        <div class="bg-white rounded-lg shadow p-6">
            <div th:if="${errorMessage}" class="p-4 bg-red-50 border border-red-200 rounded-lg mb-4">
                <p class="text-sm text-red-600" th:text="${errorMessage}">Error</p>
            </div>

            <p class="text-sm text-gray-600 mb-4">
                Masukkan 6-digit kode OTP dari aplikasi authenticator Anda.
            </p>

            <form th:action="@{/mfa-verify}" method="post" class="space-y-4">
                <div>
                    <label for="code" class="block text-sm font-medium text-gray-700 mb-1">Kode OTP (6 digit)</label>
                    <input type="text" id="code" name="code" maxlength="6" pattern="[0-9]{6}" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500"
                           placeholder="123456" autofocus />
                </div>
                <button type="submit" class="w-full px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">
                    Verifikasi
                </button>
            </form>
        </div>
    </section>
</body>
</html>
