<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|Verifikasi Dua Langkah - ${theme.footerText}|\">Verifikasi Dua Langkah</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{${theme.themeCssPath}}">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <img th:src="@{${theme.logoPath}}" th:alt="${theme.footerText}" class="h-12 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-gray-900">Verifikasi Dua Langkah</h1>
            <p class="text-gray-600 mt-1">
                Masukkan kode 6 digit dari aplikasi authenticator Anda,
                atau salah satu kode pemulihan.
            </p>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-8">
            <div th:if="${errorMessage}" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg"
                 data-testid="mfa-error">
                <span class="text-sm text-red-700" th:text="${errorMessage}">Kode tidak valid</span>
            </div>

            <form method="post" th:action="@{/mfa-verify}" class="space-y-4">
                <div>
                    <label for="code" class="block text-sm font-medium text-gray-700 mb-1">
                        Kode authenticator
                    </label>
                    <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
                           pattern="[0-9]{6}" maxlength="6" data-testid="mfa-code"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-center text-lg tracking-widest">
                </div>
                <button type="submit" data-testid="mfa-verify-submit"
                        class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-2.5 rounded-lg">
                    Verifikasi
                </button>
            </form>

            <details class="mt-6">
                <summary class="text-sm text-gray-600 cursor-pointer">Pakai kode pemulihan</summary>
                <form method="post" th:action="@{/mfa-verify}" class="mt-3 space-y-3">
                    <div>
                        <label for="recoveryCode" class="block text-sm font-medium text-gray-700 mb-1">
                            Kode pemulihan
                        </label>
                        <input type="text" id="recoveryCode" name="recoveryCode" autocomplete="off"
                               placeholder="XXXX-XXXX-XXXX-XXXX" data-testid="mfa-recovery-code"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 font-mono">
                        <p class="mt-1 text-xs text-gray-500">Setiap kode pemulihan hanya bisa dipakai sekali.</p>
                    </div>
                    <button type="submit" data-testid="mfa-recovery-submit"
                            class="w-full bg-gray-700 hover:bg-gray-800 text-white font-medium py-2.5 rounded-lg">
                        Pakai kode pemulihan
                    </button>
                </form>
            </details>
        </div>

        <p class="text-center text-sm text-gray-500 mt-6">
            Masuk sebagai <span th:text="${username}">user</span>.
            <a th:href="@{/logout}" class="text-primary-600 hover:underline">Keluar</a>
        </p>
    </div>
</body>
</html>
