<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('Kasus Pemeriksaan Baru', ~{::#page-title}, ~{::section}, ~{})}"
      lang="id">
<head>
    <title>Kasus Pemeriksaan Baru</title>
</head>
<body>
    <h1 id="page-title">Kasus Pemeriksaan Baru</h1>

    <section class="h-full flex flex-col overflow-y-auto space-y-6" data-testid="tax-inquiry-form-page">
        <div th:if="${errorMessage}" data-testid="flash-error" class="p-4 bg-red-50 border border-red-200 rounded-lg text-sm text-red-800" th:text="${errorMessage}"></div>
        <form th:action="@{/tax-audit/cases}" method="post" enctype="multipart/form-data" id="case-form"
              class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
            <div>
                <label for="inquiryType" class="block text-gray-700 mb-1">Jenis</label>
                <select id="inquiryType" name="inquiryType" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option th:each="t : ${types}" th:value="${t.name()}" th:text="${t.indonesianName}">SP2DK</option>
                </select>
            </div>
            <div>
                <label for="taxYear" class="block text-gray-700 mb-1">Tahun pajak yang diperiksa</label>
                <input type="number" id="taxYear" name="taxYear" th:value="${year}" required min="1983" max="2999" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <div>
                <label for="letterNumber" class="block text-gray-700 mb-1">Nomor surat</label>
                <input type="text" id="letterNumber" name="letterNumber" required maxlength="100" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <div>
                <label for="taxOffice" class="block text-gray-700 mb-1">Kantor pajak</label>
                <input type="text" id="taxOffice" name="taxOffice" required maxlength="200" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <div>
                <label for="letterDate" class="block text-gray-700 mb-1">Tanggal surat</label>
                <input type="date" id="letterDate" name="letterDate" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <div>
                <label for="receivedDate" class="block text-gray-700 mb-1">Tanggal diterima</label>
                <input type="date" id="receivedDate" name="receivedDate" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <div>
                <label for="deadline" class="block text-gray-700 mb-1">Tenggat jawaban</label>
                <input type="date" id="deadline" name="deadline" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <div class="md:col-span-2">
                <label for="subject" class="block text-gray-700 mb-1">Pokok permintaan</label>
                <textarea id="subject" name="subject" rows="2" required class="w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
            </div>
            <div>
                <label for="letterFile" class="block text-gray-700 mb-1">File surat (PDF/gambar)</label>
                <input type="file" id="letterFile" name="letterFile" accept=".pdf,.jpg,.jpeg,.png,.gif" class="w-full text-sm">
            </div>
            <div>
                <label for="taxDocumentId" class="block text-gray-700 mb-1">Atau surat dari register pelaporan pajak</label>
                <select id="taxDocumentId" name="taxDocumentId" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="">-- Tidak memakai --</option>
                    <option th:each="d : ${letters}" th:value="${d.id}"
                            th:text="|${d.docType} ${d.docNumber} (${d.taxFiling.taxType.indonesianName} ${d.taxFiling.period})|">SP2DK</option>
                </select>
                <p th:if="${year == null}" class="mt-1 text-xs text-gray-500">Buka halaman ini dari daftar kasus dengan tahun terpilih untuk memilih surat dari register.</p>
            </div>
            <div class="md:col-span-2">
                <button type="submit" id="btn-create-case" class="px-4 py-2 font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700">Buat Kasus</button>
            </div>
        </form>
    </section>
</body>
</html>
