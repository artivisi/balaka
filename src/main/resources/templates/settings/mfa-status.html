<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('MFA Status', ~{::#page-title}, ~{::section}, ~{::script})}"
      lang="id">
<head>
    <title>MFA Status</title>
</head>
<body>
    <h1 id="page-title">Multi-Factor Authentication (MFA)</h1>

    <section class="max-w-2xl mx-auto">
        <div class="bg-white rounded-lg shadow p-6">
            <div th:if="${successMessage}" class="p-4 bg-green-50 border border-green-200 rounded-lg mb-4">
                <p class="text-sm text-green-600" th:text="${successMessage}">Success</p>
            </div>
            <div th:if="${errorMessage}" class="p-4 bg-red-50 border border-red-200 rounded-lg mb-4">
                <p class="text-sm text-red-600" th:text="${errorMessage}">Error</p>
            </div>

            <div class="flex items-center justify-between p-4 bg-green-50 border border-green-200 rounded-lg mb-6">
                <div class="flex items-center space-x-3">
                    <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <div>
                        <p class="font-semibold text-green-700">MFA Aktif</p>
                        <p class="text-sm text-green-600">Akun Anda dilindungi dengan Two-Factor Authentication</p>
                    </div>
                </div>
            </div>

            <h2 class="text-lg font-semibold mb-4">Nonaktifkan MFA</h2>
            <p class="text-sm text-gray-600 mb-4">
                Masukkan kode OTP dari aplikasi authenticator untuk menonaktifkan MFA.
            </p>

            <form th:action="@{/settings/mfa/disable}" method="post" class="space-y-4">
                <div>
                    <label for="code" class="block text-sm font-medium text-gray-700 mb-1">Kode OTP (6 digit)</label>
                    <input type="text" id="code" name="code" maxlength="6" pattern="[0-9]{6}" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500"
                           placeholder="123456" />
                </div>
                <button type="submit" class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                    Nonaktifkan MFA
                </button>
            </form>
        </div>
    </section>
</body>
</html>
