<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout('Detail Pembayaran', ~{::#page-title}, ~{::section}, ~{})}"
      lang="id">
<head>
    <title>Detail Pembayaran</title>
</head>
<body>
    <h1 id="page-title">Detail Pembayaran</h1>

    <section class="max-w-3xl space-y-4" data-testid="withholding-payment-detail">
        <div th:if="${successMessage}" data-testid="flash-success"
             class="p-4 rounded-lg bg-green-50 border border-green-200 text-sm font-medium text-green-800"
             th:text="${successMessage}">Success</div>
        <div th:if="${errorMessage}" data-testid="flash-error"
             class="p-4 rounded-lg bg-red-50 border border-red-200 text-sm font-medium text-red-800"
             th:text="${errorMessage}">Error</div>

        <div class="bg-white rounded-lg shadow p-6">
            <dl class="grid grid-cols-2 gap-4 text-sm">
                <div><dt class="text-gray-500">Status</dt><dd class="font-medium" id="payment-status" th:text="${payment.transaction.status}">DRAFT</dd></div>
                <div><dt class="text-gray-500">Penerima</dt><dd class="font-medium" id="payment-payee" th:text="${payment.vendor.name}">-</dd></div>
                <div><dt class="text-gray-500">Perlakuan Pajak</dt><dd class="font-medium" id="payment-treatment" th:text="${payment.treatment.indonesianName}">-</dd></div>
                <div><dt class="text-gray-500">Kode Objek Pajak</dt><dd class="font-medium font-mono" th:text="${payment.taxObjectCode}">-</dd></div>
                <div><dt class="text-gray-500">Tanggal Bayar</dt><dd class="font-medium" th:text="${#temporals.format(payment.paymentDate, 'dd/MM/yyyy')}">-</dd></div>
                <div><dt class="text-gray-500">Dasar Tarif</dt><dd class="font-medium" id="payment-basis" th:text="${payment.rateBasis.indonesianName}">-</dd></div>
                <div><dt class="text-gray-500">Bruto</dt><dd class="font-medium" id="payment-gross" th:text="${#numbers.formatDecimal(payment.grossAmount, 1, 'POINT', 0, 'COMMA')}">0</dd></div>
                <div><dt class="text-gray-500">DPP</dt><dd class="font-medium" id="payment-dpp" th:text="${#numbers.formatDecimal(payment.dppAmount, 1, 'POINT', 0, 'COMMA')}">0</dd></div>
                <div><dt class="text-gray-500">Tarif Efektif atas DPP</dt><dd class="font-medium" id="payment-rate" th:text="|${payment.taxRate}%|">0</dd></div>
                <div><dt class="text-gray-500">PPh Dipotong</dt><dd class="font-medium" id="payment-tax" th:text="${#numbers.formatDecimal(payment.taxAmount, 1, 'POINT', 0, 'COMMA')}">0</dd></div>
                <div><dt class="text-gray-500">Dibayar ke Penerima</dt><dd class="font-medium" id="payment-net" th:text="${#numbers.formatDecimal(payment.netAmount, 1, 'POINT', 0, 'COMMA')}">0</dd></div>
                <div th:if="${payment.bill}"><dt class="text-gray-500">Tagihan</dt><dd class="font-medium" id="payment-bill" th:text="${payment.bill.billNumber}">-</dd></div>
            </dl>
        </div>

        <div class="flex gap-2">
            <a th:href="@{/withholding(masa=${#temporals.format(payment.paymentDate, 'yyyy-MM')})}" class="px-4 py-2 border border-gray-300 rounded-lg text-sm">Kembali</a>
            <a id="link-transaction" th:href="@{/transactions/{id}(id=${payment.transaction.id})}" class="px-4 py-2 border border-gray-300 rounded-lg text-sm">Lihat Transaksi</a>
            <form th:if="${payment.transaction.draft}" sec:authorize="hasAuthority('TRANSACTION_POST')"
                  th:action="@{/withholding/payments/{id}/post(id=${payment.id})}" method="post">
                <button type="submit" id="btn-post-payment" class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm hover:bg-primary-700">Posting</button>
            </form>
            <form th:if="${payment.transaction.draft}" sec:authorize="hasAuthority('TRANSACTION_DELETE')"
                  th:action="@{/withholding/payments/{id}/cancel(id=${payment.id})}" method="post">
                <button type="submit" id="btn-cancel-payment" class="px-4 py-2 border border-red-300 text-red-700 rounded-lg text-sm">Batalkan Draf</button>
            </form>
        </div>
    </section>
</body>
</html>
