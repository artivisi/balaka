<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|Reset Password - ${theme.footerText}|">Reset Password</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{${theme.themeCssPath}}">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <img th:src="@{${theme.logoPath}}" th:alt="${theme.footerText}" class="h-12 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-gray-900">Reset Password</h1>
        </div>
        <div class="bg-white rounded-xl shadow-lg p-8 space-y-6">
            <div th:if="${unavailable}" id="message-unavailable" class="p-4 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700" th:text="${unavailable}">Tidak tersedia</div>
            <div th:if="${linkError}" id="message-link-error" class="p-4 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
                <span th:text="${linkError}">Tautan tidak valid</span>
                <a th:href="@{/forgot-password}" id="link-request-new" class="block mt-2 underline">Minta tautan baru</a>
            </div>
            <div th:if="${errors}" id="message-errors" class="p-4 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
                <ul class="list-disc list-inside">
                    <li th:each="error : ${errors}" th:text="${error}">Error</li>
                </ul>
            </div>
            <form th:if="${token}" th:action="@{/reset-password}" method="post" class="space-y-6">
                <input type="hidden" name="token" th:value="${token}">
                <p class="text-sm text-gray-600">
                    Minimal <span th:text="${minLength}">12</span> karakter, dengan huruf besar, huruf kecil, angka, dan karakter khusus.
                </p>
                <div>
                    <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-2">Password Baru</label>
                    <input type="password" id="newPassword" name="newPassword" required th:minlength="${minLength}" autocomplete="new-password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Konfirmasi Password Baru</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required th:minlength="${minLength}" autocomplete="new-password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <button id="btn-reset-password" type="submit" class="w-full py-3 px-4 bg-primary-700 hover:bg-primary-800 text-white font-medium rounded-lg">Simpan Password Baru</button>
            </form>
            <div class="text-center">
                <a th:href="@{/login}" id="link-back-to-login" class="text-sm text-primary-700 hover:underline">Kembali ke halaman login</a>
            </div>
        </div>
    </div>
</body>
</html>
