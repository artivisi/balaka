<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|Lupa Password - ${theme.footerText}|">Lupa Password</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{${theme.themeCssPath}}">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <img th:src="@{${theme.logoPath}}" th:alt="${theme.footerText}" class="h-12 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-gray-900">Lupa Password</h1>
        </div>
        <div class="bg-white rounded-xl shadow-lg p-8 space-y-6">
            <div th:if="${unavailable}" id="message-unavailable" class="p-4 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700" th:text="${unavailable}">Tidak tersedia</div>
            <div th:if="${errorMessage}" id="message-error" class="p-4 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700" th:text="${errorMessage}">Error</div>
            <div th:if="${param.sent}" id="message-sent" class="p-4 bg-green-50 border border-green-200 rounded-lg text-sm text-green-700">
                Jika alamat tersebut terdaftar pada akun aktif, email berisi tautan reset password telah dikirim.
                Periksa kotak masuk dan folder spam.
            </div>
            <form th:unless="${unavailable}" th:action="@{/forgot-password}" method="post" class="space-y-6">
                <p class="text-sm text-gray-600">Masukkan alamat email akun Anda. Tautan untuk membuat password baru akan dikirim ke alamat tersebut.</p>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" name="email" required autofocus autocomplete="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <button id="btn-request-reset" type="submit" class="w-full py-3 px-4 bg-primary-700 hover:bg-primary-800 text-white font-medium rounded-lg">Kirim Tautan Reset</button>
            </form>
            <div class="text-center">
                <a th:href="@{/login}" id="link-back-to-login" class="text-sm text-primary-700 hover:underline">Kembali ke halaman login</a>
            </div>
        </div>
    </div>
</body>
</html>
