<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('Pelepasan Aset', ~{::#page-title}, ~{::section}, ~{})}"
      lang="id">
<head>
    <title>Pelepasan Aset</title>
</head>
<body>
    <h1 id="page-title">Pelepasan Aset</h1>

    <section class="space-y-6">
        <form th:action="@{/assets/disposals}" method="get" class="flex items-end gap-3">
            <div>
                <label for="year" class="block text-sm font-medium text-gray-700 mb-1">Tahun</label>
                <input type="number" id="year" name="year" th:value="${year}"
                       class="w-32 px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500">
            </div>
            <button id="btn-filter" type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">Tampilkan</button>
        </form>

        <div class="bg-white rounded-lg shadow overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nomor</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tanggal</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Aset</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tipe</th>
                        <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Hasil Penjualan</th>
                        <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Nilai Buku</th>
                        <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Laba/Rugi</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr th:if="${#lists.isEmpty(disposals)}">
                        <td colspan="8" class="px-4 py-8 text-center text-gray-500">Tidak ada pelepasan pada tahun ini</td>
                    </tr>
                    <tr th:each="d : ${disposals}" th:data-number="${d.recordNumber}" data-testid="disposal-row" class="text-sm">
                        <td class="px-4 py-3 font-mono"><a class="text-primary-600 hover:underline" th:href="@{/assets/disposals/{id}(id=${d.id})}" th:text="${d.recordNumber}">DSP</a></td>
                        <td class="px-4 py-3" th:text="${#temporals.format(d.disposalDate, 'dd MMM yyyy')}">01 Jan 2025</td>
                        <td class="px-4 py-3" th:text="${d.fixedAsset.displayName}">AST</td>
                        <td class="px-4 py-3" th:switch="${d.disposalType.name()}">
                            <span th:case="'SOLD'">Dijual</span>
                            <span th:case="'GIFTED'">Dihibahkan</span>
                            <span th:case="'WRITTEN_OFF'">Dihapuskan</span>
                            <span th:case="'TRANSFERRED'">Dipindahkan</span>
                        </td>
                        <td class="px-4 py-3 text-right font-mono" th:text="${#numbers.formatDecimal(d.proceeds, 0, 'COMMA', 0, 'POINT')}">0</td>
                        <td class="px-4 py-3 text-right font-mono" th:text="${#numbers.formatDecimal(d.bookValue, 0, 'COMMA', 0, 'POINT')}">0</td>
                        <td class="px-4 py-3 text-right font-mono" th:text="${#numbers.formatDecimal(d.gainLoss, 0, 'COMMA', 0, 'POINT')}">0</td>
                        <td class="px-4 py-3" th:switch="${d.status.name()}">
                            <span th:case="'DRAFT'">Draf</span>
                            <span th:case="'POSTED'">Diposting</span>
                            <span th:case="'VOIDED'">Void</span>
                            <span th:case="'CANCELLED'">Dibatalkan</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</body>
</html>
