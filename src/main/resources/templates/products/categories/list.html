<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout('Kategori Produk', ~{::#page-title}, ~{::section}, ~{::script})}"
      lang="id">
<head>
    <title>Kategori Produk</title>
</head>
<body>
    <h1 id="page-title">Kategori Produk</h1>

    <section class="space-y-6">
        <div th:if="${successMessage}" data-testid="flash-success"
             class="p-4 rounded-lg bg-green-50 border border-green-200 text-sm font-medium text-green-800"
             th:text="${successMessage}">Success</div>
        <div th:if="${errorMessage}" data-testid="flash-error"
             class="p-4 rounded-lg bg-red-50 border border-red-200 text-sm font-medium text-red-800"
             th:text="${errorMessage}">Error</div>

        <!-- Header -->
        <div class="flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center gap-4 flex-wrap">
                <!-- Search -->
                <div class="relative">
                    <label for="search-input" class="sr-only">Cari kategori</label>
                    <input type="text"
                           id="search-input"
                           name="search"
                           th:value="${search}"
                           placeholder="Cari kategori..."
                           class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500"
                           hx-get="/products/categories"
                           hx-trigger="keyup changed delay:300ms"
                           hx-target="#category-table"
                           hx-swap="outerHTML">
                    <svg class="absolute left-3 top-2.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a th:href="@{/products}" class="px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50">
                    Daftar Produk
                </a>
                <a sec:authorize="hasAuthority('PRODUCT_CREATE')" th:href="@{/products/categories/new}"
                   id="btn-new-category"
                   class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    Kategori Baru
                </a>
            </div>
        </div>

        <!-- Category Table -->
        <div class="bg-white rounded-lg shadow">
            <th:block th:insert="~{products/categories/fragments/category-table :: table}"/>
        </div>
    </section>
    <script th:attr="nonce=${cspNonce}">
        document.addEventListener('submit', function(e) {
            if (e.target.matches('.form-delete-category') && !confirm('Hapus kategori ini?')) e.preventDefault();
        });
    </script>
</body>
</html>
