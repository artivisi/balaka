spring.application.name=accounting-finance

server.port=10000

# Actuator: health only, status only, liveness/readiness groups enabled so the
# container HEALTHCHECK in the Dockerfile can probe /actuator/health/liveness.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Database connection with SSL
# sslmode=require ensures encrypted connection
# Run docker/postgres/ssl/generate-certs.sh before starting the database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:12345/accountingdb?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:accounting}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Jackson JSON configuration
spring.jackson.time-zone=Asia/Jakarta

# Thymeleaf configuration
spring.thymeleaf.cache=false

# Logging
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Suppress default ERROR logging for authentication service exceptions
# (e.g., account lockout). Our AuthenticationEventListener handles these
# with appropriate log levels (WARN for lockout, ERROR for unexpected errors)
logging.level.org.springframework.security.web.authentication.UsernamePasswordAuthenticationFilter=OFF

# Document storage configuration
app.storage.documents.path=${APP_DOCUMENT_STORAGE_PATH:data/documents}
app.storage.documents.max-file-size=10485760
# Servlet multipart limits must admit the largest upload: the archive import ZIP (100MB). Each document inside it and
# every other upload is still capped by app.storage.documents.max-file-size.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB
app.storage.documents.allowed-types=image/jpeg,image/png,image/gif,application/pdf

# Telegram Bot configuration
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.bot.webhook.url=${TELEGRAM_WEBHOOK_URL:}
telegram.bot.webhook.secret-token=${TELEGRAM_WEBHOOK_SECRET:}

# Google Cloud Vision configuration
google.cloud.vision.enabled=${GOOGLE_CLOUD_VISION_ENABLED:false}
google.cloud.vision.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}

# Field-level encryption for PII (AES-256-GCM)
# Set APP_ENCRYPTION_KEY env var. Generate with: openssl rand -base64 32
app.encryption.key=${APP_ENCRYPTION_KEY:}


# Respect X-Forwarded-* headers from reverse proxy / Cloudflare tunnel.
# native = Tomcat RemoteIpValve, which only trusts internal/loopback peers; the
# framework strategy would trust X-Forwarded-* from any client that reaches the
# container port directly. deploy/ansible/roles/app/templates sets the same value.
server.forward-headers-strategy=native

# Session security
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Error handling (hide sensitive information)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
# Payroll configuration
app.payroll.template-id=e0000000-0000-0000-0000-000000000014
# Payroll schedule cron (daily check at 6:30 AM)
app.payroll.schedule-cron=0 30 6 * * *
# Theme configuration
app.theme.name=balaka
app.theme.footer-text=Balaka
app.theme.dir=data/themes

# Demo mode (shows reset banner on every page)
app.demo-mode=${APP_DEMO_MODE:false}

# OpenAPI / springdoc configuration
springdoc.packages-to-scan=com.artivisi.accountingfinance.controller.api
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html

# Transaction API Configuration
transaction.api.enabled=true
transaction.api.require-auth=false

# Rate limiting (future implementation)
# transaction.api.rate-limit.draft-creation=10/minute
# transaction.api.rate-limit.approval=30/minute

# Withholding on non-employee and vendor payments (issue #43). No defaults in code: startup fails without these.
# PPh 21 bukan pegawai: 50% of gross per masa at Pasal 17 rates, 20% higher without NPWP/NIK. Stated by the
# issue; PMK 168/2023 from memory.
app.withholding.pph21-dpp-percent=50
app.withholding.pph21-no-id-surcharge-percent=20
# UNVERIFIED. PPh 23: 2% on services and rent (UU PPh Pasal 23 ayat (1) huruf c, PMK 141/2015),
# 100% higher without NPWP (Pasal 23 ayat (1a)). NIK treated as NPWP (PMK 112/2022).
app.withholding.pph23-rate-percent=2
app.withholding.pph23-no-id-surcharge-percent=100
# UNVERIFIED. PPh 26: 20% of gross (UU PPh Pasal 26 ayat (1)). A lower treaty rate is entered per payee and
# applies only with a DGT form valid on the payment date (PER-25/PJ/2018).
app.withholding.pph26-rate-percent=20

# Asset disposal tax effect (issue #49). No default in code: startup fails without this.
# UNVERIFIED. Indicative PPN on a sale: 12% on DPP nilai lain 11/12 of the price, effective 11% (PMK 131/2024,
# from memory). Pasal 16D UU PPN. Used vehicles have a separate DPP rule (PMK 65/2022, from memory), not modelled.
app.asset-disposal.ppn-rate-percent=11

# Evidence completeness (issue #48). No default in code: startup fails without these.
# UNVERIFIED. Retention of books, records and documents: 10 years (UU KUP Pasal 28 ayat (11), from memory).
# Counted from the end of the statement month.
app.evidence.retention-years=10
# Audit pack: document files are added to the ZIP only when their total size is at most this many bytes.
app.audit-pack.max-document-bytes=524288000

# Tax-office self-test (issue #45). No default in code: startup fails without it.
# A debit line on an OTHER_EXPENSE account at or above this amount (IDR) whose transaction has no evidence is
# reported as unitemised. Business choice, not a regulation.
app.self-test.unitemised-threshold=5000000

# Document archive import (issue #51). No default in code: startup fails without them.
# Total uncompressed bytes and number of files accepted from one ZIP (zip-bomb guard).
app.archive-import.max-total-bytes=209715200
app.archive-import.max-entries=2000
