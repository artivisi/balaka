# Local development profile.
#
# The startup guards enforce for every profile that is not explicitly a development
# one, and neither app.encryption.key nor app.setup.enabled has a default. Run local
# instances with --spring.profiles.active=dev so both are stated here.
#
# The key below is a throwaway value committed on purpose: it protects nothing and
# must never be used outside a developer machine.
app.encryption.key=Kea3OzaaPR89QOebS1b427C8xxRoztOft8rlSEL3W7k=
app.setup.enabled=true
